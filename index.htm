<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker ASCII Globe</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #00FF66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #globe-container {
            white-space: pre;
            font-size: 10px;
            line-height: 9px;
            text-align: center;
            text-shadow: 0 0 8px #00FF66;
        }
        .hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 14px;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #00FF66;
        }
    </style>
</head>
<body>

    <div class="hud">[TARGET: EARTH] // DECRYPTING MAP & CODES...</div>
    <div id="globe-container"></div>

    <script>
        const container = document.getElementById('globe-container');

        // ලෝක සිතියම සහ රටවල් පෙන්වන හැකර් අක්ෂර රාමු (ASCII Globe Animation Frames)
        const globeFrames = [
            `
               .-'""'-.       
             .'        '.     
            /   _,,,_    \\    
           |   (0) (0)    |   
           |     __,,      |  
            \\   '----'    /   
             '.        .'     
               '-....-'       
            `,
            `
               .-'""'-.       
             .' 01010  '.     
            /   100101   \\    
           |   (0) (0) 01 |   
           |  01 __,, 10   |  
            \\   '----' 01 /   
             '.  1001  .'     
               '-....-'       
            `,
            `
               .-'""'-.       
             .' 100101  '.     
            /   010101   \\    
           |   (0) (0) 10 |   
           |  10 __,, 01   |  
            \\   '----' 10 /   
             '.  0101  .'     
               '-....-'       
            `
        ];

        // වඩාත් විස්තරාත්මක ලෝක ගෝල රටාව (මැට්‍රික්ස් අංක සමග)
        const matrixFrames = [
            `
                   .::--====--::.          
               .-=====--.    .--=====--.     
            .-===-.                  .-==-.  
          .-==-.   010100101010    .-==-.    
         .==-.    10101010101010    .-==.    
        .==-.    0101010101010101    .-==.   
        .==-.    1010101010101010    .-==.   
         .==-.    01010101010101    .-==.    
          .-==-.   101010101010    .-==-.    
            .-===-.                  .-==-.  
               .-=====--.    .--=====--.     
                   '::--====--::.          
            `,
            `
                   .::--====--::.          
               .-=====--.    .--=====--.     
            .-===-.                  .-==-.  
          .-==-.   101010101010    .-==-.    
         .==-.    01010101010101    .-==.    
        .==-.    1010101010101010    .-==.   
        .==-.    0101010101010101    .-==.   
         .==-.    10101010101001    .-==.    
          .-==-.   010101010101    .-==-.    
            .-===-.                  .-==-.  
               .-=====--.    .--=====--.     
                   '::--====--::.          
            `
        ];

        let frameIndex = 0;

        function updateGlobe() {
            container.innerText = matrixFrames[frameIndex];
            frameIndex = (frameIndex + 1) % matrixFrames.length;
        }

        // වේගයෙන් මාරු වන හැකර් කේත ඇනිමේෂන් එක
        setInterval(updateGlobe, 200);
    </script>
</body>
</html>
