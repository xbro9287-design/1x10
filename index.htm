<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Earth Globe - Hacker Style</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #00FF66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #globe-container {
            white-space: pre;
            font-size: 11px;
            line-height: 10px;
            text-align: center;
            text-shadow: 0 0 5px #00FF66;
        }
    </style>
</head>
<body>

    <div id="globe-container"></div>

    <script>
        const container = document.getElementById('globe-container');
        
        // ලෝක ගෝලයේ හැඩය සහ අක්ෂර රටාව (ASCII Art frames for rotation)
        const globeFrames = [
            `
          ---------          
       ---         ---       
     --               --     
    -    @@@@@@@@@@     -    
   -   @@@@@@@@@@@@@@    -   
  -   @@@@@@@@@@@@@@@@    -  
  -   @@@@@@@@@@@@@@@@    -  
   -   @@@@@@@@@@@@@@    -   
    -    @@@@@@@@@@     -    
     --               --     
       ---         ---       
          ---------          
            `,
            `
          ---------          
       ---         ---       
     --               --     
    -    ############     -    
   -   ################    -   
  -   ##################    -  
  -   ##################    -  
   -   ################    -   
    -    ############     -    
     --               --     
       ---         ---       
          ---------          
            `,
            `
          ---------          
       ---         ---       
     --               --     
    -    .............     -    
   -   ................    -   
  -   ..................    -  
  -   ..................    -  
   -   ................    -   
    -    .............     -    
     --               --     
       ---         ---       
          ---------          
            `,
            `
          ---------          
       ---         ---       
     --               --     
    -    0101010101     -    
   -   01010101010101    -   
  -   0101010101010101    -  
  -   0101010101010101    -  
   -   01010101010101    -   
    -    0101010101     -    
     --               --     
       ---         ---       
          ---------          
            `
        ];

        let currentFrame = 0;

        function animateGlobe() {
            container.innerText = globeFrames[currentFrame];
            currentFrame = (currentFrame + 1) % globeFrames.length;
        }

        // වේගවත් හැකර් ලුක් එකක් සඳහා මිලි තත්පර 150 කට වරක් වෙනස් වීම
        setInterval(animateGlobe, 150);
    </script>
</body>
</html>
