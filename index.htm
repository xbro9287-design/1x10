<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker 3D Earth Globe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        .hud-overlay {
            position: absolute;
            top: 25px;
            left: 25px;
            color: #00FF66;
            font-size: 16px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00FF66;
            pointer-events: none;
            z-index: 10;
        }
        .hud-footer {
            position: absolute;
            bottom: 25px;
            right: 25px;
            color: #00FF66;
            font-size: 14px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #00FF66;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="hud-overlay">[SYSTEM OVERRIDE] // TARGET: PLANET EARTH</div>
    <div class="hud-footer">STATUS: SECURE // MATRIX STREAM ACTIVE</div>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three-globe@2.27.0/dist/three-globe.min.js"></script>

    <script>
        // 1. Scene, Camera සහ Renderer සැකසීම (පූර්ණ තිරය සඳහා)
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 280;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 2. දැවැන්ත 3D ලෝක ගෝලය නිර්මාණය කිරීම
        const Globe = new ThreeGlobe()
            .globeImageUrl(null)
            .showAtmosphere(true)
            .atmosphereColor('#00FF66')
            .atmosphereAltitude(0.25);

        Globe.material().color = new THREE.Color(0x000500);
        Globe.material().emissive = new THREE.Color(0x001a00);
        Globe.material().emissiveIntensity = 0.6;

        scene.add(Globe);

        // 3. රටවල් සහ දේශසීමා කොළ පාටින් ඩවුන්ලෝඩ් කර ගෝලය මත ඇඳීම
        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(countries => {
                Globe
                    .polygonsData(countries.features)
                    .polygonCapColor(() => 'rgba(0, 25, 8, 0.9)')
                    .polygonSideColor(() => 'rgba(0, 255, 102, 0.2)')
                    .polygonStrokeColor(() => '#00FF66');
            });

        // 4. ගෝලය වටා පාවෙන හැකර් කේත සහ අංක (Matrix Code Rain Particles)
        const particleCount = 1500;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesPositions = [];

        for (let i = 0; i < particleCount; i++) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 110 + Math.random() * 70;

            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);

            particlesPositions.push(x, y, z);
        }

        particlesGeometry.setAttribute('position', new THREE.Float32BufferAttribute(particlesPositions, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            color: 0x00FF66,
            size: 2.5,
            transparent: true,
            opacity: 0.9
        });

        const particleSystem = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particleSystem);

        // 5. ආලෝකය එකතු කිරීම
        const ambientLight = new THREE.AmbientLight(0x00FF66, 3);
        scene.add(ambientLight);

        // 6. ඇනිමේෂන් සහ කැරකවීම
        function animate() {
            requestAnimationFrame(animate);

            Globe.rotation.y += 0.003;
            particleSystem.rotation.y -= 0.0015;

            renderer.render(scene, camera);
        }
        animate();

        // ස්ක්‍රීන් සයිස් එක වෙනස් වන විට ස්වයංක්‍රීයව පූර්ණ තිරයට සකස් වීම
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
