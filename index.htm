<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker 3D Matrix Earth Globe</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00FF66;
            font-size: 15px;
            letter-spacing: 3px;
            text-shadow: 0 0 8px #00FF66;
            pointer-events: none;
            z-index: 10;
        }
        .hud-footer {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #00FF66;
            font-size: 13px;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #00FF66;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="hud-overlay">[ROOT@SYSTEM ~]# ACCESSING GLOBAL TARGET... // ENCRYPTED STREAM ACTIVE</div>
    <div class="hud-footer">STATUS: SECURE // MATRIX ROTATION: ONLINE</div>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three-globe@2.27.0/dist/three-globe.min.js"></script>

    <script>
        // 1. Scene, Camera සහ WebGL Renderer සැකසීම
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 300;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 2. දැවැන්ත 3D ලෝක ගෝලය නිර්මාණය කිරීම
        const Globe = new ThreeGlobe()
            .globeImageUrl(null) // සාමාන්‍ය පින්තූර අ ඉවත් කර පිරිසිදු හැකර් පෙනුමක් දීම
            .showAtmosphere(true)
            .atmosphereColor('#00FF66')
            .atmosphereAltitude(0.2);

        // ගෝලයේ අභ්‍යන්තරය තද කළු සහ අඳුරු කොළ පැහැ ගැන්වීම
        Globe.material().color = new THREE.Color(0x000200);
        Globe.material().emissive = new THREE.Color(0x001100);
        Globe.material().emissiveIntensity = 0.4;

        scene.add(Globe);

        // 3. ලෝකයේ සියලුම රටවල් සහ දේශසීමා කොළ පාට රේඛාවලින් (Polygon Borders) ඩවුන්ලෝඩ් කර සටහන් කිරීම
        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(countries => {
                Globe
                    .polygonsData(countries.features)
                    .polygonCapColor(() => 'rgba(0, 20, 5, 0.85)')    // රටවල් ඇතුළත අඳුරු කොළ පැහැය
                    .polygonSideColor(() => 'rgba(0, 255, 102, 0.1)')
                    .polygonStrokeColor(() => '#00FF66');          // රටවල්වල මායිම් හැකර් කොළ පාටින්
            });

        // 4. ගෝලය වටා හැකර් විදිහට අංක සහ කේත පාවෙමින් කැරකෙන සේ (Matrix Rain / Code Particles) සැකසීම
        const particleCount = 1200;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesPositions = [];

        for (let i = 0; i < particleCount; i++) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 105 + Math.random() * 60; // ගෝලයට ඉහළින් පාවෙන දුර

            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);

            particlesPositions.push(x, y, z);
        }

        particlesGeometry.setAttribute('position', new THREE.Float32BufferAttribute(particlesPositions, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            color: 0x00FF66,
            size: 2.2,
            transparent: true,
            opacity: 0.8
        });

        const particleSystem = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particleSystem);

        // 5. ආලෝකකරණය (Lighting) එකතු කිරීම
        const ambientLight = new THREE.AmbientLight(0x00FF66, 2.5);
        scene.add(ambientLight);

        // 6. ඇනිමේෂන් සහ අඛණ්ඩ කැරකවීමේ ලූපය (Animation Loop)
        function animate() {
            requestAnimationFrame(animate);

            // ලෝක ගෝලය සහ වටේ ඇති කේත පද්ධතිය එකිනෙකට විරුද්ධ දිශාවලට කැරකැවීම
            Globe.rotation.y += 0.003;
            particleSystem.rotation.y -= 0.0015;

            renderer.render(scene, camera);
        }
        animate();

        // ස්ක්‍රීන් සයිස් එක මාරු වන විට ස්වයංක්‍රීයව සකස් වීම (Resize Handler)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
