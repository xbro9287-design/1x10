<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Country Globe</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .hud-text {
            position: absolute;
            bottom: 25px;
            left: 25px;
            color: #00FF66;
            font-size: 13px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #00FF66;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="hud-text">[ACCESSING GLOBAL DATABASE] // COUNTRY MAP: SECURED // ROTATING...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three-globe@2.27.0/dist/three-globe.min.js"></script>

    <script>
        // 1. Scene, Camera සහ Renderer සැකසීම
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 320;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 2. ලෝක ගෝලය (Globe) නිර්මාණය කිරීම
        const Globe = new ThreeGlobe()
            .globeImageUrl(null) // සාමාන්‍ය පින්තූර ඉවත් කර පිරිසිදු හැකර් පෙනුමක් ලබා දීම
            .showAtmosphere(true)
            .atmosphereColor('#00FF66')
            .atmosphereAltitude(0.15);

        // ගෝලයේ බේස් එක සම්පූර්ණ කළු පාටට හැරවීම
        Globe.material().color = new THREE.Color(0x000500);
        Globe.material().emissive = new THREE.Color(0x001100);
        Globe.material().emissiveIntensity = 0.5;

        scene.add(Globe);

        // 3. ලෝකයේ සියලුම රටවල් සහ දේශසීමා (Country Borders) කොළ පාටින් ඩවුන්ලෝඩ් කර පෙන්වීම
        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(countries => {
                Globe
                    .polygonsData(countries.features)
                    .polygonCapColor(() => 'rgba(0, 15, 5, 0.8)')     // රටවල් ඇතුළත අඳුරු කොළ පැහැය
                    .polygonSideColor(() => 'rgba(0, 255, 102, 0.2)')
                    .polygonStrokeColor(() => '#00FF66');          // රටවල්වල දේශසීමා රේඛා පැහැදිලි හැකර් කොළ පාටින්
            });

        // 4. ගෝලය වටා පාවෙන හැකර් අංක සහ කේත (Matrix Code Particles)
        const particleCount = 500;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesPositions = [];

        for(let i = 0; i < particleCount; i++) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 105 + Math.random() * 50;

            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);

            particlesPositions.push(x, y, z);
        }

        particlesGeometry.setAttribute('position', new THREE.Float32BufferAttribute(particlesPositions, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            color: 0x00FF66,
            size: 2.5,
            transparent: true,
            opacity: 0.7
        });

        const particleSystem = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particleSystem);

        // 5. ආලෝකකරණය
        const ambientLight = new THREE.AmbientLight(0x00FF66, 2);
        scene.add(ambientLight);

        // 6. ඇනිමේෂන් සහ කැරකවීම
        function animate() {
            requestAnimationFrame(animate);

            // ලෝක ගෝලය සහ අංක මන්දගාමීව කැරකවීම
            Globe.rotation.y += 0.003;
            particleSystem.rotation.y -= 0.0015;

            renderer.render(scene, camera);
        }
        animate();

        // ස්ක්‍රීන් සයිස් වෙනස් වන විට ස්වයංක්‍රීයව හැඩගැසීම
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
