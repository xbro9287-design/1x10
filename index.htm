<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>මගේ ස්ථානය සොයාගැනීම</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-bottom: 20px;
            color: #2d3436;
        }
        button {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s;
        }
        button:hover {
            background-color: #00a884;
            transform: scale(1.05);
        }
        #result {
            margin-top: 25px;
            font-size: 16px;
            text-align: left;
            background: #f1f2f6;
            padding: 15px;
            border-radius: 8px;
            display: none;
            line-height: 1.8;
        }
        a {
            color: #0984e3;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>📍 ස්ථානය සොයන්න</h2>
        <button onclick="findLocation()">ලොකේෂන් බලන්න</button>
        <div id="result"></div>
    </div>

    <script>
        function findLocation() {
            const resultDiv = document.getElementById("result");
            resultDiv.style.display = "block";
            resultDiv.innerHTML = "ස්ථානය සෙවීම සිදුකෙරේ... කරුණාකර රැඳී සිටින්න.";

            // පළමුව බ්‍රව්සරයේ GPS (Geolocation) මඟින් උත්සාහ කරයි
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        resultDiv.innerHTML = `
                            <b>GPS මඟින් සාර්ථකයි!</b><br>
                            අක්ෂාංශ: ${lat}<br>
                            දේශාංශ: ${lon}<br><br>
                            <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank">🗺️ Google Maps එකේ බලන්න</a>
                        `;
                    },
                    (error) => {
                        // GPS බැරි නම් IP හරහා ලොකේෂන් එක ලබා ගැනීමට උත්සාහ කරයි (Fallback)
                        getIPLocation();
                    },
                    { timeout: 10000 }
                );
            } else {
                getIPLocation();
            }
        }

        // IP address එක මඟින් නගරය සහ රට සොයාගැනීමේ ක්‍රමය
        function getIPLocation() {
            fetch('https://ipapi.co/json/')
                .then(response => response.json())
                .then(data => {
                    const resultDiv = document.getElementById("result");
                    if (data.city) {
                        resultDiv.innerHTML = `
                            <b>ජාලය (IP) හරහා සොයාගත් තොරතුරු:</b><br>
                            රට: ${data.country_name}<br>
                            නගරය: ${data.city}<br>
                            ප්‍රාන්තය: ${data.region}<br><br>
                            <a href="https://www.google.com/maps?q=${data.latitude},${data.longitude}" target="_blank">🗺️ Google Maps එකේ බලන්න</a>
                        `;
                    } else {
                        resultDiv.innerHTML = "ස්ථාන තොරතුරු ලබාගැනීමට නොහැකි විය.";
                    }
                })
                .catch(() => {
                    document.getElementById("result").innerHTML = "දෝෂයක් ඇති විය. අන්තර්ජාල සම්බන්ධතාව පරීක්ෂා කරන්න.";
                });
        }
    </script>

</body>
</html>
