<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_NET v4.0 - Ultimate Hacker Control System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three-globe@2.27.0/dist/three-globe.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #00FF66;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        /* පසුබිම් මැට්‍රික්ස් අංක වැටෙන කෑන්වස් එක */
        #matrix-rain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: 0.25;
            pointer-events: none;
        }
        /* ත්‍රිමාණ ලෝක ගෝල කෑන්වස් එක */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        /* ප්‍රධාන ලේআউট එක */
        .main-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: grid;
            grid-template-rows: 70px 1fr;
            pointer-events: none;
        }
        /* උඩ හෙඩර් කොටස */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            background: rgba(0, 5, 2, 0.9);
            border-bottom: 1px solid #00FF66;
            pointer-events: auto;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-icon {
            font-size: 24px;
            text-shadow: 0 0 10px #00FF66;
            animation: pulse 1.5s infinite;
        }
        .site-title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 8px #00FF66;
        }
        .system-status {
            font-size: 13px;
            letter-spacing: 2px;
            color: #00cc52;
            text-shadow: 0 0 5px #00FF66;
        }
        /* පහළ කන්ටෙන්ට් එක */
        .content-body {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 30px;
            pointer-events: none;
        }
        .left-info {
            background: rgba(0, 10, 3, 0.85);
            border: 1px solid #00FF66;
            padding: 20px;
            max-width: 350px;
            pointer-events: auto;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
            border-radius: 4px;
        }
