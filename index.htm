<script>
    window.sendMessage = async function() {
        const inputField = document.getElementById("user-input");
        const chatBox = document.getElementById("chat-box");
        const userText = inputField.value.trim();

        if (!userText) return;

        // පරිශීලක පණිවිඩය එකතු කිරීම
        chatBox.innerHTML += `<div class="message user-msg">${userText}</div>`;
        inputField.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        // ලෝඩින් මැසේජ් එකක් පෙන්වීම
        const loadingId = "loading-" + Date.now();
        chatBox.innerHTML += `<div id="${loadingId}" class="message ai-msg loading">කල්පනා කරමින් ඉන්නවා...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        const apiKey = "AQ.Ab8RN6KtRpeqpr4J6APo2FAhFc5u1O3cBLIw8yHipVfSpcgj3Q"; // ඔබේ API Key එක
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: userText }]
                    }],
                    systemInstruction: {
                        parts: [{ text: "ඔයා පරිගණක වැඩසටහනක් හෝ රොබෝ කෙනෙක් නෙවෙයි, මනුෂ්‍යයෙක් (Human) වගේ හිතලා කතා කරන කෙනෙක්. අපේ බසින් බොහොම ස්වභාවිකව, යාළුවෙක් එක්ක කතා කරනවා වගේ කතා කරන්න. යම් දෙයක් හොඳ නම් ඒකේ තියෙන හොඳ පැත්තත්, නරක නම් ඒකේ තියෙන අඩුපාඩු සහ අවදානම් කිසිදු පැකිලීමකින් තොරව නරක විදිහටත් (මධ්‍යස්ථව සහ සාධාරණව) කෙළින් පැහැදිලි කරලා දෙන්න." }]
                    }
                })
            });

            const data = await response.json();
            document.getElementById(loadingId).remove();

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const aiText = data.candidates[0].content.parts[0].text;
                chatBox.innerHTML += `<div class="message ai-msg">${aiText}</div>`;
            } else {
                chatBox.innerHTML += `<div class="message ai-msg" style="color:red;">මොකක් හරි දෝෂයක් සිදු විය.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;

        } catch (error) {
            console.error("දෝෂයක් සිදු විය:", error);
            document.getElementById(loadingId).remove();
            chatBox.innerHTML += `<div class="message ai-msg" style="color:red;">අයියෝ, සම්බන්ධ වීමේ දෝෂයක් වුණා.</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }
</script>
